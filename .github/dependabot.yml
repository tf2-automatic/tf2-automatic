version: 2
updates:
  - package-ecosystem: github-actions
    target-branch: main
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One PR per action across all directories, instead of one per directory
      actions:
        patterns:
          - '*'
        group-by: dependency-name
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    target-branch: main
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
